spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medlibrary
    username: meduser
    password: medpass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    issuer: medlibrary-dev
    secret: dev-secret-key
    expiration: 3600
